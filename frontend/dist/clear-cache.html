<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Cache - JK Tyre</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        button {
            background: #ff6b00;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background: #e55a00;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            font-weight: bold;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 Clear Application Cache</h1>
        <p>Click the button below to clear all cached data for JK Tyre application.</p>
        
        <button onclick="clearCache()">Clear Cache Now</button>
        <button onclick="window.location.href='/'">Go to Dashboard</button>
        
        <div id="status"></div>
    </div>

    <script>
        function clearCache() {
            const statusDiv = document.getElementById('status');
            let messages = [];

            try {
                // Clear localStorage
                const localStorageCount = localStorage.length;
                localStorage.clear();
                messages.push(`✓ Cleared ${localStorageCount} localStorage items`);
            } catch (e) {
                messages.push('⚠ Could not clear localStorage');
            }

            try {
                // Clear sessionStorage
                const sessionStorageCount = sessionStorage.length;
                sessionStorage.clear();
                messages.push(`✓ Cleared ${sessionStorageCount} sessionStorage items`);
            } catch (e) {
                messages.push('⚠ Could not clear sessionStorage');
            }

            // Display results
            statusDiv.className = 'status success';
            statusDiv.innerHTML = `
                <strong>Cache Cleared Successfully!</strong><br><br>
                ${messages.join('<br>')}
                <br><br>
                <strong>Next steps:</strong><br>
                1. Press Ctrl+Shift+R to hard refresh<br>
                2. Or click "Go to Dashboard" button above
            `;

            // Optional: Reload after 2 seconds
            setTimeout(() => {
                if (confirm('Cache cleared! Reload page now?')) {
                    window.location.href = '/';
                }
            }, 2000);
        }

        // Show initial info
        window.onload = function() {
            const statusDiv = document.getElementById('status');
            statusDiv.className = 'status info';
            statusDiv.innerHTML = `
                <strong>Current Storage:</strong><br>
                localStorage: ${localStorage.length} items<br>
                sessionStorage: ${sessionStorage.length} items
            `;
        };
    </script>
</body>
</html>
